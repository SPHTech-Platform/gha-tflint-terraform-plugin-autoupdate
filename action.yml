name: "Update tflint terraform plugin"
description: "Run bash script to check for latest version of tflint terraform plugin"

inputs:
  GITHUB_TOKEN:
    description: "Muilti-line list of secrets to expose to the build"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install latest version of GNU awk
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install gawk -y

    - name: Fetch latest version of tflint terraform plugin and patch version
      shell: bash
      run: $GITHUB_ACTION_PATH/update-tflint.sh

    - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ inputs.GITHUB_TOKEN }}
        branch: update/tflint-terraform-plugin
        title: Update tflint terraform plugin version
        commit-message: "chore: update tflint terraform plugin"
        body: "Update versions of tflint terraform plugin to latest version. Please close and open PR manually to trigger CI checks."
